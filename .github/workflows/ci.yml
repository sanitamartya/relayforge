name: CI

on:
  push:
    branches:
      - main
      - "phase-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relayforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://relayforge:relayforge@localhost:5432/relayforge?schema=public
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run quality checks
        run: npm run check
